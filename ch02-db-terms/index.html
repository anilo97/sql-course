<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터베이스 핵심 용어 마스터 퀴즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-page: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-callout: #EFF6FF;
      --text-main: #0F172A;
      --text-sub: #334155;
      --text-muted: #64748B;
      --border-light: #CBD5E1;
      --border-dark: #1E293B;
      --primary: #1D4ED8;
      --primary-hover: #1E40AF;
      --success: #15803D;
      --success-bg: #F0FDF4;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      color: var(--text-main);
      background-color: var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }

    /* Sticky Top Bar */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #FFFFFF;
      border-bottom: 1px solid var(--border-light);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 14.5px;
    }

    .back-link:hover { text-decoration: underline; }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15.5px;
      font-weight: 700;
    }

    .timer-display {
      background-color: var(--border-dark);
      color: #FFFFFF;
      padding: 4px 12px;
      font-family: 'Consolas', monospace;
      font-size: 16px;
    }

    /* Main Container */
    .page-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .doc-header { margin-bottom: 28px; }
    .doc-title {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .help-callout {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      font-size: 15.5px;
      color: var(--text-sub);
    }

    /* Layout Grid: Quiz Left + Leaderboard Right */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 920px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .section-block {
      border: 1px solid var(--border-light);
      border-top: 3px solid var(--border-dark);
      background-color: #FFFFFF;
      margin-bottom: 24px;
    }

    .section-header {
      padding: 14px 20px;
      background-color: var(--bg-subtle);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
    }

    .section-body { padding: 20px; }

    /* Start Gate */
    .start-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      font-family: inherit;
      font-size: 16px;
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      color: var(--text-main);
      background-color: #FFFFFF;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 20px;
      border: 1px solid var(--border-dark);
      background-color: #FFFFFF;
      color: var(--text-main);
      cursor: pointer;
    }

    .btn:hover { background-color: #F1F5F9; }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover { background-color: var(--primary-hover); }

    /* Word Bank */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px;
      background-color: var(--bg-callout);
      border: 1px solid #BFDBFE;
      margin-bottom: 20px;
    }

    .word-chip {
      background-color: #FFFFFF;
      border: 1px solid #93C5FD;
      color: #1E3A8A;
      font-size: 14.5px;
      font-weight: 600;
      padding: 4px 10px;
    }

    /* Quiz Table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15.5px;
    }

    th, td {
      border: 1px solid var(--border-light);
      padding: 12px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background-color: #F1F5F9;
      font-weight: 700;
    }

    .quiz-input {
      width: 100%;
      font-size: 15.5px !important;
      padding: 8px 10px !important;
    }

    .quiz-input.correct {
      border-color: var(--success);
      background-color: var(--success-bg);
      color: var(--success);
      font-weight: 700;
    }

    .quiz-input.wrong {
      border-color: var(--danger);
      background-color: var(--danger-bg);
    }

    .status-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 8px;
    }

    .badge-ok { background-color: var(--success-bg); color: var(--success); }
    .badge-err { background-color: var(--danger-bg); color: var(--danger); }

    .locked-overlay {
      opacity: 0.45;
      pointer-events: none;
      user-select: none;
    }

    /* Result Banner */
    .result-banner {
      display: none;
      margin-top: 20px;
      padding: 18px 20px;
      border: 2px solid var(--success);
      background-color: var(--success-bg);
    }

    .result-banner.show { display: block; }

    /* Leaderboard */
    .rank-list {
      list-style: none;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #E2E8F0;
      font-size: 15px;
    }

    .rank-item:last-child { border-bottom: none; }
    .rank-top { background-color: #FFFBEB; font-weight: 700; }

    .rank-num {
      display: inline-block;
      width: 26px;
      font-weight: 700;
      color: var(--primary);
    }

    .rank-time {
      font-family: 'Consolas', monospace;
      font-weight: 700;
      color: var(--text-sub);
    }

    .btn-refresh {
      font-size: 13.5px;
      padding: 4px 10px;
      border: 1px solid var(--border-light);
      background: #FFFFFF;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-inner">
      <a href="../index.html" class="back-link">&larr; 실습 아카이브 목록</a>
      <div class="timer-box">
        <span id="playerLabel" style="color: var(--text-sub);">도전자: 미입력</span>
        <span class="timer-display" id="timerDisplay">00.0초</span>
      </div>
    </div>
  </nav>

  <main class="page-container">
    <header class="doc-header">
      <h1 class="doc-title">데이터베이스 핵심 용어 스피드 퀴즈</h1>
      <div class="help-callout">
        별명을 입력하고 <strong>[퀴즈 시작]</strong>을 누르면 타이머가 작동합니다. 상단 <strong>[보기]</strong>를 참고해 9개 개념의 용어를 직접 입력하고, 모두 맞혀 실시간 순위표에 기록을 등록해 보세요!
      </div>
    </header>

    <div class="main-grid">
      <!-- Left: Quiz Area -->
      <div>
        <!-- Step 1: Nickname & Start -->
        <section class="section-block">
          <div class="section-header">
            <h2 class="section-title">1. 도전자 등록 및 시작</h2>
          </div>
          <div class="section-body">
            <div class="start-row">
              <input type="text" id="nicknameInput" placeholder="별명 입력 (예: 재활왕김민수)" style="flex: 1; min-width: 200px;" />
              <button type="button" class="btn btn-primary" id="startBtn" onclick="startQuiz()">퀴즈 시작</button>
              <button type="button" class="btn" onclick="resetQuiz()">다시 풀기</button>
            </div>
          </div>
        </section>

        <!-- Step 2: Quiz Table -->
        <section class="section-block locked-overlay" id="quizSection">
          <div class="section-header">
            <h2 class="section-title">2. 개념 설명을 읽고 핵심 용어 입력하기</h2>
            <span style="font-size: 14px; color: var(--text-muted);">한글 또는 영문/약어 입력 가능</span>
          </div>
          <div class="section-body">
            <div style="font-size: 14.5px; font-weight: 700; color: var(--primary); margin-bottom: 6px;">[보기 목록]</div>
            <div class="word-bank" id="wordBank"></div>

            <table>
              <thead>
                <tr>
                  <th style="width: 7%;">번호</th>
                  <th style="width: 55%;">개념 및 역할 설명</th>
                  <th style="width: 26%;">용어 입력</th>
                  <th style="width: 12%; text-align: center;">결과</th>
                </tr>
              </thead>
              <tbody id="quizBody"></tbody>
            </table>

            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 12px;">
              <button type="button" class="btn btn-primary" onclick="checkAnswers()">채점 및 기록 제출하기</button>
            </div>

            <div class="result-banner" id="resultBanner"></div>
          </div>
        </section>
      </div>

      <!-- Right: Realtime Leaderboard -->
      <aside class="section-block">
        <div class="section-header">
          <h2 class="section-title">실시간 Top 10 순위</h2>
          <button type="button" class="btn-refresh" onclick="fetchLeaderboard()">새로고침</button>
        </div>
        <div class="section-body" style="padding: 8px 12px;">
          <ul class="rank-list" id="rankList">
            <li class="rank-item" style="color: var(--text-muted);">순위 데이터를 불러오는 중...</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>

  <script>
    // ==========================================
    // [필수 설정] 본인의 Supabase 프로젝트 정보 입력
    // ==========================================
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    let supabaseClient = null;
    if (SUPABASE_URL.startsWith('http') && window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const quizData = [
      {
        id: 1,
        desc: "하나하나의 단편적인 정보 값 (예: '홍길동', 2500, '2026-09-07')",
        answers: ['데이터', 'data']
      },
      {
        id: 2,
        desc: "데이터를 저장하기 위해 열과 행으로 구성한 표 형태의 기본 저장 단위",
        answers: ['테이블', 'table', '표']
      },
      {
        id: 3,
        desc: "여러 개의 테이블을 저장해 두는 논리적 공간 (MySQL에서는 스키마와 같은 의미)",
        answers: ['데이터베이스', 'db', 'database', '스키마', 'schema']
      },
      {
        id: 4,
        desc: "데이터베이스를 운영하고 관리하는 소프트웨어 (예: MySQL)",
        answers: ['dbms', '데이터베이스관리시스템', 'databasemanagementsystem']
      },
      {
        id: 5,
        desc: "테이블의 세로 항목. 각 열은 고유한 열 이름(예: 아이디, 주소)을 가짐",
        answers: ['열', '컬럼', '열컬럼', 'column', '필드', '속성']
      },
      {
        id: 6,
        desc: "각 열에 저장할 데이터의 형태 지정 (예: 이름은 문자, 수량은 숫자, 제조일자는 날짜)",
        answers: ['데이터형식', '데이터타입', 'datatype', '자료형']
      },
      {
        id: 7,
        desc: "테이블의 가로 데이터 1건. 개수는 곧 저장된 데이터의 총 건수(예: 회원 수)와 같음",
        answers: ['행', '로우', '행로우', 'row', '레코드', '튜플']
      },
      {
        id: 8,
        desc: "테이블에서 각 행을 유일하게 구분하기 위해 지정하는 열 (중복 불가, 필수 입력)",
        answers: ['기본키', 'pk', 'primarykey']
      },
      {
        id: 9,
        desc: "테이블 생성, 데이터 입력·조회 등을 위해 사람과 DBMS가 소통하는 언어",
        answers: ['sql', 'structuredquerylanguage', '질의어']
      }
    ];

    const wordBankItems = [
      '데이터', '테이블', '데이터베이스', 'DBMS',
      '열 (컬럼)', '데이터 형식', '행 (로우)', '기본 키 (PK)', 'SQL'
    ];

    let startTime = null;
    let timerInterval = null;
    let isRunning = false;
    let isCompleted = false;

    function normalize(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/[\s\(\)\-_]/g, '');
    }

    function initRender() {
      const bankEl = document.getElementById('wordBank');
      bankEl.innerHTML = wordBankItems.map(w => `<span class="word-chip">${w}</span>`).join('');

      const tbody = document.getElementById('quizBody');
      tbody.innerHTML = quizData.map((q, idx) => `
        <tr>
          <td style="text-align: center; font-weight: 700;">${q.id}</td>
          <td>${q.desc}</td>
          <td><input type="text" class="quiz-input" id="ans_${idx}" placeholder="용어 입력" /></td>
          <td style="text-align: center;" id="res_${idx}">-</td>
        </tr>
      `).join('');

      fetchLeaderboard();
    }

    function startQuiz() {
      const nick = document.getElementById('nicknameInput').value.trim();
      if (!nick) {
        alert('먼저 본인의 별명을 입력해 주세요!');
        document.getElementById('nicknameInput').focus();
        return;
      }

      document.getElementById('playerLabel').textContent = `도전자: ${nick}`;
      document.getElementById('nicknameInput').disabled = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('quizSection').classList.remove('locked-overlay');

      isRunning = true;
      isCompleted = false;
      startTime = performance.now();

      timerInterval = setInterval(() => {
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
        document.getElementById('timerDisplay').textContent = `${elapsed}초`;
      }, 100);

      document.getElementById('ans_0').focus();
    }

    async function checkAnswers() {
      if (!isRunning || isCompleted) return;

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        const inputEl = document.getElementById(`ans_${idx}`);
        const resEl = document.getElementById(`res_${idx}`);
        const userVal = normalize(inputEl.value);

        const isRight = q.answers.some(ans => normalize(ans) === userVal);
        if (isRight) {
          correctCount++;
          inputEl.classList.remove('wrong');
          inputEl.classList.add('correct');
          inputEl.disabled = true;
          resEl.innerHTML = `<span class="status-badge badge-ok">정답</span>`;
        } else {
          inputEl.classList.remove('correct');
          inputEl.classList.add('wrong');
          resEl.innerHTML = `<span class="status-badge badge-err">오답</span>`;
        }
      });

      if (correctCount === quizData.length) {
        clearInterval(timerInterval);
        isRunning = false;
        isCompleted = true;

        const finalSec = Number(((performance.now() - startTime) / 1000).toFixed(2));
        document.getElementById('timerDisplay').textContent = `${finalSec}초`;

        const nick = document.getElementById('nicknameInput').value.trim();
        const banner = document.getElementById('resultBanner');
        banner.classList.add('show');
        banner.innerHTML = `
          <div style="font-size: 18px; font-weight: 700; color: var(--success); margin-bottom: 4px;">
            축하합니다! ${nick}님, 9문제 전부 정답 (100점) 완료!
          </div>
          <div style="font-size: 16px;">최종 기록: <strong>${finalSec}초</strong> — 우측 실시간 순위표에 자동 등록됩니다.</div>
        `;

        await submitScore(nick, 100, finalSec);
      } else {
        alert(`총 ${quizData.length}문제 중 ${correctCount}문제 정답입니다. 빨간색 오답 칸을 수정해서 다시 제출하세요! (타이머는 계속 흐릅니다)`);
      }
    }

    async function submitScore(nickname, score, elapsedSec) {
      if (!supabaseClient) {
        console.warn('Supabase 키가 설정되지 않아 로컬 테스트 모드로 동작합니다.');
        return;
      }

      const { error } = await supabaseClient
        .from('db_quiz_ranking')
        .insert([{ nickname, score, elapsed_sec: elapsedSec }]);

      if (error) {
        console.error('기록 저장 오류:', error);
        alert('순위 등록 중 오류가 발생했습니다: ' + error.message);
      } else {
        await fetchLeaderboard();
      }
    }

    async function fetchLeaderboard() {
      const listEl = document.getElementById('rankList');
      if (!supabaseClient) {
        listEl.innerHTML = `<li class="rank-item" style="color: var(--text-muted); font-size: 14px;">HTML 코드 상단의 SUPABASE_URL과 ANON_KEY를 입력하면 실시간 순위가 표시됩니다.</li>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from('db_quiz_ranking')
        .select('nickname, elapsed_sec, created_at')
        .order('elapsed_sec', { ascending: true })
        .limit(10);

      if (error) {
        listEl.innerHTML = `<li class="rank-item" style="color: var(--danger);">순위 조회 실패</li>`;
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = `<li class="rank-item" style="color: var(--text-muted);">아직 등록된 기록이 없습니다. 첫 번째 1등에 도전하세요!</li>`;
        return;
      }

      listEl.innerHTML = data.map((row, idx) => `
        <li class="rank-item ${idx === 0 ? 'rank-top' : ''}">
          <div>
            <span class="rank-num">${idx + 1}위</span>
            <span>${escapeHtml(row.nickname)}</span>
          </div>
          <span class="rank-time">${Number(row.elapsed_sec).toFixed(2)}초</span>
        </li>
      `).join('');
    }

    function resetQuiz() {
      clearInterval(timerInterval);
      isRunning = false;
      isCompleted = false;
      document.getElementById('timerDisplay').textContent = '00.0초';
      document.getElementById('nicknameInput').disabled = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('quizSection').classList.add('locked-overlay');
      document.getElementById('resultBanner').classList.remove('show');
      initRender();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    initRender();
  </script>
</body>
</html>
