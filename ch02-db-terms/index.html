<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터베이스 핵심 용어 스피드 퀴즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-page: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-callout: #EFF6FF;
      --text-main: #0F172A;
      --text-sub: #334155;
      --text-muted: #64748B;
      --border-light: #CBD5E1;
      --border-dark: #1E293B;
      --primary: #1D4ED8;
      --primary-hover: #1E40AF;
      --success: #15803D;
      --success-bg: #F0FDF4;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15.5px;
      line-height: 1.45;
      color: var(--text-main);
      background-color: var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }

    /* Sticky Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #FFFFFF;
      border-bottom: 2px solid var(--border-dark);
    }

    .top-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 8px 20px;
    }

    .control-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }

    .back-link:hover { text-decoration: underline; }

    .page-title {
      font-size: 18.5px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      font-family: inherit;
      font-size: 15px;
      padding: 6px 10px;
      border: 1px solid var(--border-light);
      color: var(--text-main);
      background-color: #FFFFFF;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      padding: 6px 13px;
      border: 1px solid var(--border-dark);
      background-color: #FFFFFF;
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { background-color: #F1F5F9; }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-submit-lg {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
    }

    .timer-display {
      background-color: var(--border-dark);
      color: #FFFFFF;
      padding: 5px 12px;
      font-family: 'Consolas', monospace;
      font-size: 15.5px;
      font-weight: 700;
      min-width: 76px;
      text-align: center;
    }

    /* Sticky Word Bank Strip */
    .word-bank-strip {
      margin-top: 7px;
      padding: 6px 10px;
      background-color: var(--bg-callout);
      border: 1px solid #BFDBFE;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .bank-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin-right: 4px;
    }

    .word-chip {
      background-color: #FFFFFF;
      border: 1px solid #93C5FD;
      color: #1E3A8A;
      font-size: 13px;
      font-weight: 600;
      padding: 1px 8px;
    }

    /* Main Workspace Grid */
    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 20px 20px;
      display: grid;
      grid-template-columns: 1fr 295px;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .main-container { grid-template-columns: 1fr; }
    }

    /* 2-Column Compact Quiz Cards */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (max-width: 680px) {
      .quiz-grid { grid-template-columns: 1fr; }
    }

    .q-card {
      border: 1px solid var(--border-light);
      background-color: #FFFFFF;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .q-card.card-correct {
      border-color: var(--success);
      background-color: var(--success-bg);
    }

    .q-card.card-wrong {
      border-color: var(--danger);
      background-color: var(--danger-bg);
    }

    .q-top {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-main);
    }

    .q-num {
      display: inline-block;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-light);
      font-weight: 700;
      font-size: 12px;
      padding: 0 6px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .q-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quiz-input {
      flex: 1;
      width: 100%;
      font-size: 14.5px !important;
      padding: 5px 9px !important;
    }

    .quiz-input.correct {
      border-color: var(--success);
      background-color: #FFFFFF;
      color: var(--success);
      font-weight: 700;
    }

    .quiz-input.wrong {
      border-color: var(--danger);
      background-color: #FFFFFF;
    }

    .status-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 7px;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge-wait { color: var(--text-muted); border-color: #E2E8F0; background: var(--bg-subtle); }
    .badge-ok { background-color: var(--success); color: #FFFFFF; }
    .badge-err { background-color: var(--danger); color: #FFFFFF; }

    .locked-overlay {
      opacity: 0.45;
      pointer-events: none;
      user-select: none;
    }

    /* Right Side Stack: Submit Box + Leaderboard */
    .side-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .submit-box {
      border: 1px solid var(--border-light);
      background-color: var(--bg-subtle);
      padding: 12px;
    }

    .result-feedback {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      display: none;
    }

    .result-feedback.show {
      display: block;
    }

    /* Compact Leaderboard */
    .rank-panel {
      border: 1px solid var(--border-light);
      border-top: 3px solid var(--border-dark);
      background-color: #FFFFFF;
    }

    .rank-header {
      padding: 9px 12px;
      background-color: var(--bg-subtle);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rank-title {
      font-size: 15.5px;
      font-weight: 700;
    }

    .btn-refresh {
      font-size: 12px;
      padding: 2px 8px;
      border: 1px solid var(--border-light);
      background: #FFFFFF;
      cursor: pointer;
    }

    .rank-list {
      list-style: none;
      padding: 4px 10px;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
      border-bottom: 1px solid #F1F5F9;
      font-size: 14px;
    }

    .rank-item:last-child { border-bottom: none; }
    .rank-top { background-color: #FFFBEB; font-weight: 700; }

    .rank-num {
      display: inline-block;
      width: 34px;
      font-weight: 700;
      color: var(--primary);
    }

    .rank-time {
      font-family: 'Consolas', monospace;
      font-weight: 700;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <!-- Compact Sticky Header + Controls + Word Bank -->
  <header class="top-bar">
    <div class="top-inner">
      <div class="control-strip">
        <div class="title-group">
          <a href="../index.html" class="back-link">&larr; 목록</a>
          <h1 class="page-title">데이터베이스 핵심 용어 스피드 퀴즈</h1>
        </div>

        <div class="player-controls">
          <input type="text" id="nicknameInput" placeholder="별명 입력 (예: 재활왕)" style="width: 175px;" />
          <button type="button" class="btn btn-primary" id="startBtn" onclick="startQuiz()">퀴즈 시작</button>
          <button type="button" class="btn" onclick="resetQuiz()">다시 풀기 (섞기)</button>
          <span class="timer-display" id="timerDisplay">00.0초</span>
        </div>
      </div>

      <!-- Always-visible Word Bank -->
      <div class="word-bank-strip">
        <span class="bank-label">[보기]</span>
        <div id="wordBank" style="display: flex; flex-wrap: wrap; gap: 5px;"></div>
      </div>
    </div>
  </header>

  <!-- Main Content: 2-Col Quiz Left + Submit & Leaderboard Right -->
  <main class="main-container">
    <section id="quizSection" class="locked-overlay">
      <div class="quiz-grid" id="quizGrid"></div>
    </section>

    <aside class="side-column">
      <!-- Submit Button Box above Top 10 -->
      <div class="submit-box locked-overlay" id="submitSection">
        <button type="button" class="btn btn-primary btn-submit-lg" onclick="checkAnswers()">채점 및 기록 제출하기</button>
        <div id="resultFeedback" class="result-feedback"></div>
      </div>

      <!-- Top 10 Leaderboard -->
      <div class="rank-panel">
        <div class="rank-header">
          <h2 class="rank-title">실시간 Top 10 순위</h2>
          <button type="button" class="btn-refresh" onclick="fetchLeaderboard()">새로고침</button>
        </div>
        <ul class="rank-list" id="rankList">
          <li class="rank-item" style="color: var(--text-muted);">순위 데이터를 불러오는 중...</li>
        </ul>
      </div>
    </aside>
  </main>

  <script>
    // ==========================================
    // [필수 설정] 본인의 Supabase 프로젝트 정보 입력
    // ==========================================
    const SUPABASE_URL = 'https://xzjmrowvrwiyzruqzloz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_mMe7MfliNjBG9O0v2t9Dgw_omgRkeXF';

    let supabaseClient = null;
    if (SUPABASE_URL.startsWith('http') && window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const baseQuizData = [
      {
        id: 1,
        desc: "하나하나의 단편적인 정보 값 (예: '홍길동', 2500, '2026-09-07')",
        answers: ['데이터', 'data']
      },
      {
        id: 2,
        desc: "데이터를 저장하기 위해 열과 행으로 구성한 표 형태의 기본 저장 단위",
        answers: ['테이블', 'table', '표']
      },
      {
        id: 3,
        desc: "여러 개의 테이블을 저장해 두는 논리적 공간 (MySQL에서는 스키마와 같은 의미)",
        answers: ['데이터베이스', 'db', 'database', '스키마', 'schema']
      },
      {
        id: 4,
        desc: "데이터베이스를 운영하고 관리하는 소프트웨어 (예: MySQL)",
        answers: ['dbms', '데이터베이스관리시스템', 'databasemanagementsystem']
      },
      {
        id: 5,
        desc: "테이블의 세로 항목. 각 열은 고유한 열 이름(예: 아이디, 주소)을 가짐",
        answers: ['열', '컬럼', '열컬럼', 'column', '필드', '속성']
      },
      {
        id: 6,
        desc: "각 열에 저장할 데이터의 형태 지정 (예: 이름은 문자, 수량은 숫자, 제조일자는 날짜)",
        answers: ['데이터형식', '데이터타입', 'datatype', '자료형']
      },
      {
        id: 7,
        desc: "테이블의 가로 데이터 1건. 개수는 곧 저장된 데이터의 총 건수(예: 회원 수)와 같음",
        answers: ['행', '로우', '행로우', 'row', '레코드', '튜플']
      },
      {
        id: 8,
        desc: "테이블에서 각 행을 유일하게 구분하기 위해 지정하는 열 (중복 불가, 필수 입력)",
        answers: ['기본키', '기본키pk', 'pk', 'primarykey', 'primarykeypk']
      },
      {
        id: 9,
        desc: "테이블 생성, 데이터 입력·조회 등을 위해 사람과 DBMS가 소통하는 언어",
        answers: ['sql', 'structuredquerylanguage', '질의어']
      }
    ];

    const wordBankItems = [
      '데이터', '테이블', '데이터베이스', 'DBMS',
      '열 (컬럼)', '데이터 형식', '행 (로우)', '기본 키 (PK)', 'SQL'
    ];

    let activeQuizList = [];
    let startTime = null;
    let timerInterval = null;
    let isRunning = false;
    let isCompleted = false;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalize(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/[\s\(\)\-_]/g, '');
    }

    function renderBoard(shouldShuffle = true) {
      activeQuizList = shouldShuffle ? shuffleArray(baseQuizData) : [...baseQuizData];
      const shuffledBank = shouldShuffle ? shuffleArray(wordBankItems) : [...wordBankItems];

      const bankEl = document.getElementById('wordBank');
      bankEl.innerHTML = shuffledBank.map(w => `<span class="word-chip">${w}</span>`).join('');

      const grid = document.getElementById('quizGrid');
      grid.innerHTML = activeQuizList.map((q, idx) => `
        <div class="q-card" id="card_${idx}">
          <div class="q-top">
            <span class="q-num">Q${idx + 1}</span>
            <span>${q.desc}</span>
          </div>
          <div class="q-input-row">
            <input type="text" class="quiz-input" id="ans_${idx}" placeholder="용어 입력" onkeydown="if(event.key==='Enter') checkAnswers()" />
            <span class="status-badge badge-wait" id="res_${idx}">대기</span>
          </div>
        </div>
      `).join('');
    }

    function startQuiz() {
      const nick = document.getElementById('nicknameInput').value.trim();
      if (!nick) {
        alert('먼저 본인의 별명을 입력해 주세요!');
        document.getElementById('nicknameInput').focus();
        return;
      }

      renderBoard(true);

      document.getElementById('nicknameInput').disabled = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('quizSection').classList.remove('locked-overlay');
      document.getElementById('submitSection').classList.remove('locked-overlay');

      const fb = document.getElementById('resultFeedback');
      fb.classList.remove('show');
      fb.textContent = '';

      isRunning = true;
      isCompleted = false;
      startTime = performance.now();

      timerInterval = setInterval(() => {
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
        document.getElementById('timerDisplay').textContent = `${elapsed}초`;
      }, 100);

      document.getElementById('ans_0').focus();
    }

    async function checkAnswers() {
      if (!isRunning || isCompleted) return;

      let correctCount = 0;
      activeQuizList.forEach((q, idx) => {
        const cardEl = document.getElementById(`card_${idx}`);
        const inputEl = document.getElementById(`ans_${idx}`);
        const resEl = document.getElementById(`res_${idx}`);
        const userVal = normalize(inputEl.value);

        const isRight = q.answers.some(ans => normalize(ans) === userVal);
        if (isRight) {
          correctCount++;
          cardEl.classList.remove('card-wrong');
          cardEl.classList.add('card-correct');
          inputEl.classList.remove('wrong');
          inputEl.classList.add('correct');
          inputEl.disabled = true;
          resEl.className = 'status-badge badge-ok';
          resEl.textContent = '정답';
        } else {
          cardEl.classList.remove('card-correct');
          cardEl.classList.add('card-wrong');
          inputEl.classList.remove('correct');
          inputEl.classList.add('wrong');
          resEl.className = 'status-badge badge-err';
          resEl.textContent = '오답';
        }
      });

      const nick = document.getElementById('nicknameInput').value.trim();
      const fb = document.getElementById('resultFeedback');
      fb.classList.add('show');

      if (correctCount === activeQuizList.length) {
        clearInterval(timerInterval);
        isRunning = false;
        isCompleted = true;

        const finalSec = Number(((performance.now() - startTime) / 1000).toFixed(2));
        document.getElementById('timerDisplay').textContent = `${finalSec}초`;

        fb.style.color = 'var(--success)';
        fb.textContent = `완주 성공! ${nick}님 기록: ${finalSec}초`;

        await submitScore(nick, 100, finalSec);
      } else {
        fb.style.color = 'var(--danger)';
        fb.textContent = `${activeQuizList.length}문제 중 ${correctCount}문제 정답 (오답 수정 후 재제출)`;
      }
    }

    async function submitScore(nickname, score, elapsedSec) {
      if (!supabaseClient) return;

      const { error } = await supabaseClient
        .from('db_quiz_ranking')
        .insert([{ nickname, score, elapsed_sec: elapsedSec }]);

      if (error) {
        alert('순위 등록 중 오류가 발생했습니다: ' + error.message);
      } else {
        await fetchLeaderboard();
      }
    }

    async function fetchLeaderboard() {
      const listEl = document.getElementById('rankList');
      if (!supabaseClient) {
        listEl.innerHTML = `<li class="rank-item" style="color: var(--text-muted); font-size: 13.5px;">SUPABASE_URL과 ANON_KEY를 입력하면 실시간 순위가 표시됩니다.</li>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from('db_quiz_ranking')
        .select('nickname, elapsed_sec')
        .order('elapsed_sec', { ascending: true })
        .limit(10);

      if (error) {
        listEl.innerHTML = `<li class="rank-item" style="color: var(--danger);">순위 조회 실패</li>`;
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = `<li class="rank-item" style="color: var(--text-muted); font-size: 13.5px;">아직 등록된 기록이 없습니다. 첫 번째 1등에 도전하세요!</li>`;
        return;
      }

      listEl.innerHTML = data.map((row, idx) => `
        <li class="rank-item ${idx === 0 ? 'rank-top' : ''}">
          <div>
            <span class="rank-num">${idx + 1}위</span>
            <span>${escapeHtml(row.nickname)}</span>
          </div>
          <span class="rank-time">${Number(row.elapsed_sec).toFixed(2)}초</span>
        </li>
      `).join('');
    }

    function resetQuiz() {
      clearInterval(timerInterval);
      isRunning = false;
      isCompleted = false;
      document.getElementById('timerDisplay').textContent = '00.0초';
      document.getElementById('nicknameInput').disabled = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('quizSection').classList.add('locked-overlay');
      document.getElementById('submitSection').classList.add('locked-overlay');

      const fb = document.getElementById('resultFeedback');
      fb.classList.remove('show');
      fb.textContent = '';

      renderBoard(true);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    renderBoard(true);
    fetchLeaderboard();
  </script>
</body>
</html>
