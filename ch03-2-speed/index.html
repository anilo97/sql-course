<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CH 03-2 정렬·그룹화·집계 핵심 문법 스피드 퀴즈</title>
    <link rel="stylesheet" href="../assets/css/common.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script src="../assets/js/supabase-service.js"></script>
  </head>
  <body class="quiz-mode">
    <header class="quiz-top-bar">
      <div class="quiz-top-inner">
        <div class="control-strip">
          <div class="title-group">
            <a href="../index.html" class="back-link">&larr; 목록</a>
            <span class="chapter-badge">CH 03-2</span>
            <h1 class="page-title-sm">1. 정렬 · 그룹화 · 집계 핵심 문법 스피드 퀴즈</h1>
          </div>

          <div class="player-controls">
            <input type="text" id="nicknameInput" placeholder="별명 입력 (예: SQL마스터)" style="width: 175px" />
            <button type="button" class="btn btn-primary" id="startBtn" onclick="startQuiz()">퀴즈 시작</button>
            <button type="button" class="btn" onclick="resetQuiz()">다시 풀기 (섞기)</button>
            <span class="timer-display" id="timerDisplay">00.0초</span>
          </div>
        </div>

        <div class="word-bank-strip">
          <span class="bank-label">[보기]</span>
          <div id="wordBank" style="display: flex; flex-wrap: wrap; gap: 4px"></div>
        </div>
      </div>
    </header>

    <main class="quiz-main-container">
      <section id="quizSection" class="locked-overlay">
        <div class="quiz-grid" id="quizGrid"></div>
      </section>

      <aside class="side-column">
        <div class="submit-box locked-overlay" id="submitSection">
          <button type="button" class="btn btn-primary btn-submit-lg" onclick="checkAnswers()">채점 및 기록 제출하기</button>
          <div id="resultFeedback" class="result-feedback"></div>
        </div>

        <div class="rank-panel">
          <div class="rank-header">
            <h2 class="rank-title">실시간 Top 10 순위</h2>
            <button type="button" class="btn-refresh" onclick="fetchLeaderboard()">새로고침</button>
          </div>
          <ul class="rank-list" id="rankList">
            <li class="rank-item" style="color: var(--text-muted)">순위 데이터를 불러오는 중...</li>
          </ul>
        </div>
      </aside>
    </main>

    <script>
      const CHAPTER_ID = 'ch03-2-speed';

      const baseQuizData = [
        {
          id: 1,
          desc: '조회 결과의 데이터 값에는 영향을 주지 않고, 출력되는 행의 정렬 순서를 지정할 때 사용하는 절',
          answers: ['orderby', '정렬orderby'],
        },
        {
          id: 2,
          desc: '정렬 시 큰 값부터 작은 값 순서(내림차순)로 출력하기 위해 열 이름 뒤에 붙이는 키워드',
          answers: ['desc', '내림차순desc'],
        },
        {
          id: 3,
          desc: '정렬 시 오름차순을 의미하며, 생략 시 기본값으로 적용되는 키워드',
          answers: ['asc', '오름차순asc'],
        },
        {
          id: 4,
          desc: '조회 결과 중 위에서부터 원하는 개수만큼만 잘라서 출력 개수를 제한할 때 사용하는 절',
          answers: ['limit', '개수제한limit'],
        },
        {
          id: 5,
          desc: '조회 결과에서 중복된 데이터를 제거하고 고유한 값만 1개씩 남길 때 열 이름 앞에 붙이는 예약어',
          answers: ['distinct', '중복제거distinct'],
        },
        {
          id: 6,
          desc: '특정 열의 공통된 값끼리 데이터를 그룹으로 묶어 요약 통계를 낼 때 사용하는 절',
          answers: ['groupby', '그룹화groupby'],
        },
        {
          id: 7,
          desc: '그룹화된 열의 합계를 계산할 때 사용하는 집계 함수 이름 (괄호 제외)',
          answers: ['sum', '합계sum'],
        },
        {
          id: 8,
          desc: '그룹화된 열의 평균값을 계산할 때 사용하는 집계 함수 이름 (괄호 제외)',
          answers: ['avg', '평균avg'],
        },
        {
          id: 9,
          desc: '<code>NULL</code> 값을 제외하고 실제 데이터가 들어 있는 행의 개수만 셀 때 사용하는 함수 형식',
          answers: ['count열', 'count열이름', 'countcolumn'],
        },
        {
          id: 10,
          desc: '집계 함수(<code>SUM</code>, <code>AVG</code> 등)를 조건식에 사용할 때 <code>WHERE</code> 대신 <code>GROUP BY</code> 뒤에 쓰는 조건절',
          answers: ['having', '그룹조건having'],
        },
        {
          id: 11,
          desc: '그룹 내 가장 작은 값(최솟값)을 구할 때 사용하는 집계 함수 이름 (괄호 제외)',
          answers: ['min', '최솟값min'],
        },
        {
          id: 12,
          desc: '그룹 내 가장 큰 값(최댓값)을 구할 때 사용하는 집계 함수 이름 (괄호 제외)',
          answers: ['max', '최댓값max'],
        },
      ];

      const wordBankItems = [
        'ORDER BY',
        'DESC',
        'ASC',
        'LIMIT',
        'DISTINCT',
        'GROUP BY',
        'SUM',
        'AVG',
        'COUNT(열)',
        'HAVING',
        'MIN',
        'MAX',
      ];

      let activeQuizList = [];
      let startTime = null;
      let timerInterval = null;
      let isRunning = false;
      let isCompleted = false;

      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function normalize(str) {
        return String(str || '').toLowerCase().replace(/[\s\(\)\-_]/g, '');
      }

      function renderBoard(shouldShuffle = true) {
        activeQuizList = shouldShuffle ? shuffleArray(baseQuizData) : [...baseQuizData];
        const shuffledBank = shouldShuffle ? shuffleArray(wordBankItems) : [...wordBankItems];

        document.getElementById('wordBank').innerHTML = shuffledBank
          .map((w) => `<span class="word-chip">${w}</span>`)
          .join('');

        document.getElementById('quizGrid').innerHTML = activeQuizList
          .map(
            (q, idx) => `
          <div class="q-card" id="card_${idx}">
            <div class="q-top">
              <span class="q-num">Q${idx + 1}</span>
              <span>${q.desc}</span>
            </div>
            <div class="q-input-row">
              <input type="text" class="quiz-input" id="ans_${idx}" placeholder="SQL 예약어 또는 함수 입력" onkeydown="if(event.key==='Enter') checkAnswers()" />
              <span class="status-badge badge-wait" id="res_${idx}">대기</span>
            </div>
          </div>
        `
          )
          .join('');
      }

      function startQuiz() {
        const nick = document.getElementById('nicknameInput').value.trim();
        if (!nick) {
          alert('먼저 본인의 별명을 입력해 주세요!');
          document.getElementById('nicknameInput').focus();
          return;
        }

        renderBoard(true);
        document.getElementById('nicknameInput').disabled = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('quizSection').classList.remove('locked-overlay');
        document.getElementById('submitSection').classList.remove('locked-overlay');

        const fb = document.getElementById('resultFeedback');
        fb.classList.remove('show');
        fb.textContent = '';

        isRunning = true;
        isCompleted = false;
        startTime = performance.now();

        timerInterval = setInterval(() => {
          const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
          document.getElementById('timerDisplay').textContent = `${elapsed}초`;
        }, 100);

        document.getElementById('ans_0').focus();
      }

      async function checkAnswers() {
        if (!isRunning || isCompleted) return;

        let correctCount = 0;
        activeQuizList.forEach((q, idx) => {
          const cardEl = document.getElementById(`card_${idx}`);
          const inputEl = document.getElementById(`ans_${idx}`);
          const resEl = document.getElementById(`res_${idx}`);
          const userVal = normalize(inputEl.value);

          const isRight = q.answers.some((ans) => normalize(ans) === userVal);
          if (isRight) {
            correctCount++;
            cardEl.classList.remove('card-wrong');
            cardEl.classList.add('card-correct');
            inputEl.classList.remove('wrong');
            inputEl.classList.add('correct');
            inputEl.disabled = true;
            resEl.className = 'status-badge badge-ok';
            resEl.textContent = '정답';
          } else {
            cardEl.classList.remove('card-correct');
            cardEl.classList.add('card-wrong');
            inputEl.classList.remove('correct');
            inputEl.classList.add('wrong');
            resEl.className = 'status-badge badge-err';
            resEl.textContent = '오답';
          }
        });

        const nick = document.getElementById('nicknameInput').value.trim();
        const fb = document.getElementById('resultFeedback');
        fb.classList.add('show');

        if (correctCount === activeQuizList.length) {
          clearInterval(timerInterval);
          isRunning = false;
          isCompleted = true;

          const exactSec = Number(((performance.now() - startTime) / 1000).toFixed(2));
          document.getElementById('timerDisplay').textContent = `${exactSec}초`;

          fb.style.color = 'var(--success)';
          fb.textContent = `완주 성공! ${nick}님 기록: ${exactSec}초`;

          const res = await window.SqlCourseDB.submitScore({
            chapterId: CHAPTER_ID,
            nickname: nick,
            score: 100,
            totalQuestions: activeQuizList.length,
            elapsedSec: exactSec
          });

          if (!res.ok) {
            alert('순위 등록 중 오류가 발생했습니다: ' + res.error);
          } else {
            await fetchLeaderboard();
          }
        } else {
          fb.style.color = 'var(--danger)';
          fb.textContent = `${activeQuizList.length}문제 중 ${correctCount}문제 정답 (오답 수정 후 재제출)`;
        }
      }

      async function fetchLeaderboard() {
        const listEl = document.getElementById('rankList');
        const res = await window.SqlCourseDB.fetchLeaderboard({
          chapterId: CHAPTER_ID,
          limit: 10,
          sortBy: 'time'
        });

        if (res.noConfig) {
          listEl.innerHTML = `<li class="rank-item" style="color: var(--text-muted); font-size: 13px;">루트 폴더의 supabase-config.js에 키를 입력하면 실시간 순위가 표시됩니다.</li>`;
          return;
        }
        if (!res.ok) {
          listEl.innerHTML = `<li class="rank-item" style="color: var(--danger);">순위 조회 실패</li>`;
          return;
        }
        if (res.data.length === 0) {
          listEl.innerHTML = `<li class="rank-item" style="color: var(--text-muted); font-size: 13px;">아직 등록된 기록이 없습니다. 첫 번째 1등에 도전하세요!</li>`;
          return;
        }

        listEl.innerHTML = res.data
          .map(
            (row, idx) => `
          <li class="rank-item ${idx === 0 ? 'rank-top' : ''}">
            <div>
              <span class="rank-num">${idx + 1}위</span>
              <span>${window.SqlCourseDB.escapeHtml(row.nickname)}</span>
            </div>
            <span class="rank-time">${Number(row.elapsed_sec).toFixed(2)}초</span>
          </li>
        `
          )
          .join('');
      }

      function resetQuiz() {
        clearInterval(timerInterval);
        isRunning = false;
        isCompleted = false;
        document.getElementById('timerDisplay').textContent = '00.0초';
        document.getElementById('nicknameInput').disabled = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('quizSection').classList.add('locked-overlay');
        document.getElementById('submitSection').classList.add('locked-overlay');

        const fb = document.getElementById('resultFeedback');
        fb.classList.remove('show');
        fb.textContent = '';

        renderBoard(true);
      }

      renderBoard(true);
      fetchLeaderboard();
    </script>
  </body>
</html>
