<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터베이스와 SQL 실습 아카이브 | 디지털 재활 헬스케어 AI 개발자 양성 과정</title>
  <link rel="stylesheet" href="./assets/css/common.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./assets/js/supabase-service.js"></script>
  <style>
    body {
      background-color: #F8FAFC;
    }

    .hub-wrapper {
      max-width: 1060px;
      margin: 0 auto;
      padding: 44px 24px 64px;
    }

    .hub-header {
      background-color: #FFFFFF;
      border: 1px solid var(--border-light);
      border-top: 4px solid var(--primary);
      padding: 28px 32px;
      margin-bottom: 28px;
    }

    .course-tag {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.01em;
    }

    .hub-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 6px;
      letter-spacing: -0.02em;
    }

    .hub-subtitle {
      font-size: 16px;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (max-width: 768px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    .syllabus-card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-light);
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }

    .syllabus-card.is-active:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .syllabus-card.is-upcoming {
      background-color: #F8FAFC;
      opacity: 0.72;
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ch-badge {
      display: inline-block;
      font-family: 'Consolas', monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--primary);
      background-color: #EFF6FF;
      border: 1px solid #BFDBFE;
      padding: 3px 10px;
      user-select: none;
    }

    .ch-badge.has-ranking {
      cursor: pointer;
    }

    .ch-badge.is-muted {
      color: var(--text-muted);
      background-color: #F1F5F9;
      border-color: #CBD5E1;
    }

    .type-pill {
      font-size: 12.5px;
      font-weight: 700;
      padding: 2px 8px;
      background-color: #F1F5F9;
      color: var(--text-sub);
    }

    .type-pill.quiz {
      background-color: #FEF3C7;
      color: #92400E;
    }

    .card-title {
      font-size: 18.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card-title a {
      color: inherit;
      text-decoration: none;
    }

    .card-title a:hover {
      color: var(--primary);
    }

    .card-desc {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.58;
      margin-bottom: 18px;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #F1F5F9;
    }

    .card-link {
      color: var(--primary);
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .card-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .hub-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Easter Egg Admin Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.55);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-box {
      background-color: #FFFFFF;
      border: 1px solid var(--border-dark);
      border-top: 4px solid var(--danger);
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.18);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .modal-target {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--primary);
      background-color: var(--bg-callout);
      padding: 6px 10px;
      margin-bottom: 12px;
    }

    .modal-desc {
      font-size: 14.5px;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .pin-input {
      width: 100%;
      text-align: center;
      font-family: 'Consolas', monospace;
      font-size: 22px !important;
      letter-spacing: 0.35em;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .modal-msg {
      font-size: 13.5px;
      font-weight: 700;
      min-height: 20px;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="hub-wrapper">
    <!-- 상단 강의 헤더 -->
    <header class="hub-header">
      <div class="course-tag">디지털 재활 헬스케어 AI 개발자 양성 과정</div>
      <h1 class="hub-title">데이터베이스와 SQL 실습 아카이브</h1>
      <p class="hub-subtitle">
        교재 《혼자 공부하는 SQL with AI》 기반 헬스케어 도메인 실습 워크시트 및 스피드 퀴즈 목록입니다.
      </p>
    </header>

    <!-- 카드형 실습 목록 -->
    <main class="card-grid" id="cardGrid"></main>

    <footer class="hub-footer">
      모든 실습 워크시트는 브라우저에 자동 저장되며, 작성 완료 후 마크다운(.md) 문서로 다운로드하여 노션에 보관할 수 있습니다.
    </footer>
  </div>

  <!-- 이스터에그: 랭킹 초기화 비밀번호 모달 -->
  <div class="modal-backdrop" id="resetModal" onclick="if(event.target === this) closeResetModal()">
    <div class="modal-box">
      <h2 class="modal-title">랭킹 데이터 초기화</h2>
      <div class="modal-target" id="modalTargetLabel"></div>
      <p class="modal-desc">
        해당 실습의 Supabase 실시간 순위 기록을 모두 삭제합니다. 관리자 비밀번호 4자리를 입력하세요.
      </p>
      <input
        type="password"
        id="adminPinInput"
        class="pin-input"
        maxlength="4"
        inputmode="numeric"
        placeholder="••••"
        onkeydown="if(event.key==='Enter') confirmResetRanking()"
      />
      <div class="modal-msg" id="modalMsg"></div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeResetModal()">취소</button>
        <button type="button" class="btn btn-danger" id="confirmResetBtn" onclick="confirmResetRanking()">순위 초기화 실행</button>
      </div>
    </div>
  </div>

  <script>
    const curriculumItems = [
      {
        chapter: 'CH 02-1',
        quizId: 'ch02-db-terms',
        typeLabel: '스피드 퀴즈',
        isQuiz: true,
        title: '1. 데이터베이스 핵심 용어 스피드 퀴즈',
        desc: '테이블, 열(Column), 행(Row), 기본 키(PK), DBMS 등 필수 개념 9가지를 직접 입력하며 익히고 실시간 순위표에 도전합니다.',
        href: './ch02-db-terms/',
        cta: '퀴즈 시작',
        active: true
      },
      {
        chapter: 'CH 02-1',
        quizId: null,
        typeLabel: '모델링 워크시트',
        isQuiz: false,
        title: '2. AI 홈 재활 서비스 데이터베이스 모델링 실습',
        desc: '업무 분석부터 테이블·열 정의, 기본 키(PK) 검증, MySQL Workbench EER 다이어그램 구현까지 단계별로 진행합니다.',
        href: './ch02-db-modeling/',
        cta: '실습 시작',
        active: true
      },
      {
        chapter: 'CH 02-2',
        quizId: 'ch02-2-quiz',
        typeLabel: '스피드 퀴즈',
        isQuiz: true,
        title: '1. 실전 용어 & 데이터 형식 스피드 퀴즈',
        desc: '스키마, 문자형(CHAR), 정수형(INT), NN, Null과 CRUD 핵심 SQL 명령어 12문항을 2열 한 화면에서 빠르게 복습합니다.',
        href: './ch02-2-quiz/',
        cta: '퀴즈 시작',
        active: true
      },
      {
        chapter: 'CH 02-2',
        quizId: null,
        typeLabel: '트러블슈팅 실습',
        isQuiz: false,
        title: '2. SQL 에러 5대장 트러블슈팅 실습',
        desc: 'DB 미선택, CHAR 길이 초과, INT 형식 불일치, PK 중복, 세미콜론 누락 등 대표 에러 5가지를 직접 일으키고 해결합니다.',
        href: './ch02-2-debug/',
        cta: '실습 시작',
        active: true
      },
      {
        chapter: 'CH 03-1',
        quizId: null,
        typeLabel: 'SQL 조회 실습',
        isQuiz: false,
        title: 'SELECT ~ FROM ~ WHERE 실전 조회 미션',
        desc: '비교·논리 연산자, BETWEEN, IN, LIKE 와일드카드, 서브쿼리를 활용해 market_db 조건 조회 쿼리 7단계를 실습합니다.',
        href: './ch03-1-select/',
        cta: '실습 시작',
        active: true
      },
      {
        chapter: 'CH 03-2',
        quizId: 'ch03-2-speed',
        typeLabel: '스피드 퀴즈',
        isQuiz: true,
        title: '1. 정렬 · 그룹화 · 집계 핵심 문법 스피드 퀴즈',
        desc: 'ORDER BY, LIMIT, DISTINCT, GROUP BY, HAVING 및 집계 함수 12개 핵심 예약어를 빠르게 입력하며 순위표에 도전합니다.',
        href: './ch03-2-speed/',
        cta: '퀴즈 시작',
        active: true
      },
      {
        chapter: 'CH 03-2',
        quizId: 'ch03-2-quiz',
        typeLabel: '쿼리 조립 게임',
        isQuiz: true,
        title: '2. SQL 쿼리 파이프라인 디펜스 게임',
        desc: 'SELECT부터 LIMIT까지 SQL 7단계 작성 순서대로 블록을 조립해 함정을 피하고 8스테이지 방어에 도전합니다.',
        href: './ch03-2-quiz/',
        cta: '게임 시작',
        active: true
      },
      {
        chapter: 'CH 03-2',
        quizId: null,
        typeLabel: '실전 워크시트',
        isQuiz: false,
        title: '3. 정렬 · 그룹화 · 집계 14단계 실전 워크시트',
        desc: '다중 정렬, 그룹별 집계 통계, HAVING 조건 필터링, 오류 쿼리 디버깅까지 14개 SQL 문제를 직접 작성하고 채점합니다.',
        href: './ch03-2-group/',
        cta: '실습 시작',
        active: true
      },
      {
        chapter: 'CH 04',
        quizId: null,
        typeLabel: '준비 중',
        isQuiz: false,
        title: '데이터 변경과 테이블 생성 (CREATE · INSERT · UPDATE)',
        desc: '설계한 헬스케어 테이블을 SQL DDL로 직접 구축하고 신규 환자 및 운동 수행 데이터를 적재·수정합니다.',
        href: null,
        cta: '준비 중',
        active: false
      },
      {
        chapter: 'CH 05',
        quizId: null,
        typeLabel: '준비 중',
        isQuiz: false,
        title: '테이블 조인과 통합 데이터셋 추출 (PK · FK · JOIN)',
        desc: '환자 마스터와 시계열 운동 기록 테이블을 외래 키(FK)로 연결해 AI 모델 학습용 데이터셋을 추출합니다.',
        href: null,
        cta: '준비 중',
        active: false
      }
    ];

    let selectedQuizId = null;
    let selectedTitle = '';

    function renderCards() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = curriculumItems.map((item) => {
        if (!item.active) {
          return `
            <article class="syllabus-card is-upcoming">
              <div>
                <div class="card-top-row">
                  <span class="ch-badge is-muted">${item.chapter}</span>
                  <span class="type-pill">${item.typeLabel}</span>
                </div>
                <h2 class="card-title" style="color: var(--text-muted);">${item.title}</h2>
                <p class="card-desc" style="color: var(--text-muted);">${item.desc}</p>
              </div>
              <div class="card-footer">
                <span style="font-size: 14px; font-weight: 600; color: var(--text-muted);">준비 중</span>
              </div>
            </article>
          `;
        }

        const badgeClickAttr = item.quizId
          ? `onclick="openResetModal('${item.quizId}', '${item.chapter} · ${item.title}')"`
          : '';
        const badgeClass = item.quizId ? 'ch-badge has-ranking' : 'ch-badge';

        return `
          <article class="syllabus-card is-active">
            <div>
              <div class="card-top-row">
                <span class="${badgeClass}" ${badgeClickAttr}>${item.chapter}</span>
                <span class="type-pill ${item.isQuiz ? 'quiz' : ''}">${item.typeLabel}</span>
              </div>
              <h2 class="card-title">
                <a href="${item.href}">${item.title}</a>
              </h2>
              <p class="card-desc">${item.desc}</p>
            </div>
            <div class="card-footer">
              <a href="${item.href}" class="card-link">
                <span>${item.cta}</span>
                <span aria-hidden="true">&rarr;</span>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    function openResetModal(quizId, label) {
      selectedQuizId = quizId;
      selectedTitle = label;
      document.getElementById('modalTargetLabel').textContent = label;
      document.getElementById('adminPinInput').value = '';
      const msgEl = document.getElementById('modalMsg');
      msgEl.textContent = '';
      msgEl.style.color = 'var(--text-main)';
      document.getElementById('confirmResetBtn').disabled = false;
      document.getElementById('resetModal').classList.add('show');
      setTimeout(() => document.getElementById('adminPinInput').focus(), 50);
    }

    function closeResetModal() {
      document.getElementById('resetModal').classList.remove('show');
      selectedQuizId = null;
    }

    async function confirmResetRanking() {
      if (!selectedQuizId) return;
      const pin = document.getElementById('adminPinInput').value;
      const msgEl = document.getElementById('modalMsg');
      const btn = document.getElementById('confirmResetBtn');

      if (pin.length !== 4) {
        msgEl.style.color = 'var(--danger)';
        msgEl.textContent = '4자리 숫자를 모두 입력해 주세요.';
        return;
      }

      btn.disabled = true;
      msgEl.style.color = 'var(--text-sub)';
      msgEl.textContent = '초기화 처리 중...';

      const res = await window.SqlCourseDB.resetChapterRanking(selectedQuizId, pin);
      if (res.ok) {
        msgEl.style.color = 'var(--success)';
        msgEl.textContent = '해당 챕터의 순위표가 깨끗하게 초기화되었습니다!';
        setTimeout(() => closeResetModal(), 1100);
      } else {
        btn.disabled = false;
        msgEl.style.color = 'var(--danger)';
        msgEl.textContent = res.error;
        document.getElementById('adminPinInput').value = '';
        document.getElementById('adminPinInput').focus();
      }
    }

    renderCards();
  </script>
</body>
</html>
